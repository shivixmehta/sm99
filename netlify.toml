# Netlify config for Journée (the app lives in journee/).
# This file sits at the repo root so Netlify finds it without any dashboard
# settings; `base` points the build at the journee folder, and the other paths
# are relative to it. Settings in this file override the Netlify UI.
[build]
  base = "journee"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# SPA fallback (the function's own path /api/ai is matched first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
